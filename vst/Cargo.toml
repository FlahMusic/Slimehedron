# Slimehedron — native plugin workspace.
#
# THREE crates, and the split is the whole insurance policy:
#   slimehedron-core    the engine. DSP, physics, music theory. Knows nothing about plugins,
#                       nothing about windows, nothing about a host. Compiles to WASM, so the
#                       website can eventually run this same code instead of a second synth.
#   slimehedron-plugin  the CLAP plugin. Raw CLAP via clap-sys; notes in, sound out (milestone 1b).
#   slimehedron-ui      the webview GUI. (not scaffolded yet)
#
# The GUI stack we are heading for (wxp) is alpha, and the template we start from says plainly it
# offers no API compatibility. That is survivable only because neither of them can reach into
# `core`. If the window library dies we replace a window, not an engine.
[workspace]
members = ["slimehedron-core", "slimehedron-plugin"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["FlahMusic (Flah)"]
repository = "https://github.com/FlahMusic/Slimehedron"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The tank's goo is ~1600 drops a tick: unoptimized, its tests take minutes. Tests still build with debug asserts;
# only the speed check needs `--release`.
[profile.dev.package.slimehedron-core]
opt-level = 2
